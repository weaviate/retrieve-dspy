[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieve-dspy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cohere>=5.16.1",
    "datasets>=4.0.0",
    "dspy==3.*",
    "fastapi>=0.115.0",
    "hdbscan>=0.8.40",
    "ipykernel>=6.30.1",
    "ir-datasets>=0.5.11",
    "matplotlib>=3.10.5",
    "pyversity>=0.1.1",
    "pyyaml>=6.0.0",
    "query-agent-benchmarking>=0.7",
    "requests>=2.31.0",
    "ruff>=0.12.7",
    "tiktoken>=0.7.0",
    "uvicorn>=0.32.0",
    "voyageai>=0.3.4",
    "wandb>=0.25.1",
    "weaviate-client[agents]>=4.16.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["retrieve_dspy*"]

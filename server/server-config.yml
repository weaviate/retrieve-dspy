# Server Configuration for retrieve-dspy

server:
  host: "0.0.0.0"
  port: 8000

# Weaviate Database Configuration
weaviate:
  collection_name: "BrightBiology_Default"
  target_property_name: "content"
  search_type: "bm25"  # Options: "bm25", "vector", "hybrid"
  embedding_model: "weaviate/Snowflake/snowflake-arctic-embed-l-v2.0"  # provider/model-name

# ─────────────────────────────────────────────────────────────────────────────
# Retriever Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Set 'active' to choose which retriever to use.
# Each retriever's parameters are defined in its own section below.

retriever:
  active: "HyDE_QueryExpander"  # Options: "BaseRetriever", "RAGFusion", "ConcatenatedQuerySearcher", "HyDE_QueryExpander", "PRF_QueryExpander", "SearchQueryWriter"

  # ───────────────────────────────────────────────────────────────────────────
  # BaseRetriever
  # ───────────────────────────────────────────────────────────────────────────
  # Simple hybrid (keyword + vector) search with optional diversity reranking.
  
  BaseRetriever:
    retrieved_k: 20              # Number of results to return
    verbose: false
    search_only: true            # If false, generates an answer (not implemented)
    diversity_weight: 0          # 0 = no diversity, 0.5 = balanced, 1 = max diversity (uses MMR)

  # ───────────────────────────────────────────────────────────────────────────
  # ConcatenatedQuerySearcher
  # ───────────────────────────────────────────────────────────────────────────
  # Generates multiple search queries, concatenates them into a single query,
  # then applies pyversity diversity ranking algorithms to the results.
  
  ConcatenatedQuerySearcher:
    number_of_queries: 5         # Number of search queries to generate and concatenate
    retrieved_k: 100             # Number of results to retrieve initially
    final_k: 50                  # Number of final results after diversity ranking (defaults to retrieved_k)
    verbose: true
    verbose_signature: true      # Use verbose query generation prompts (more detailed)
    search_only: true
    
    # ─────────────────────────────────────────────────────────────────────────
    # Diversity Ranking (powered by pyversity)
    # ─────────────────────────────────────────────────────────────────────────
    # Set diversity_weight > 0 to enable diversity ranking
    diversity_weight: 0        # 0.0 = pure relevance, 1.0 = pure diversity
    
    # Diversity strategy options:
    #   - "mmr": Maximal Marginal Relevance - balances relevance and diversity
    #   - "msd": Max Sum of Distances - maximizes diversity by selecting distant points
    #   - "dpp": Determinantal Point Process - probabilistic diversity sampling
    #   - "cover": Coverage-based selection - ensures coverage of embedding space
    diversity_strategy: "mmr"

  # ───────────────────────────────────────────────────────────────────────────
  # RAGFusion
  # ───────────────────────────────────────────────────────────────────────────
  # Generates multiple query variations, retrieves results for each,
  # then fuses them using the selected fusion strategy.
  
  RAGFusion:
    number_of_queries: 5         # Number of query variations to generate
    retrieved_k: 10              # Results per query variation (5 queries × 10 results = 50 total)
    reranked_k: 50               # Results after fusion
    verbose: true
    verbose_signature: true      # Use verbose query generation prompts
    
    # ─────────────────────────────────────────────────────────────────────────
    # Fusion Strategy: "rrf", "interleave", or "ce_gated"
    # ─────────────────────────────────────────────────────────────────────────
    fusion_strategy: "ce_gated"  # Options: "rrf", "interleave", "ce_gated"
    
    # RRF settings (for fusion_strategy: "rrf")
    rrf_k: 60                    # RRF constant (higher = more weight to lower ranks)
    
    # CE-Gated Pooling settings (for fusion_strategy: "ce_gated")
    # Uses cross-encoder to score docs against original + sub-queries
    # Final score = α × s₀(d) + (1-α) × s_sub(d)
    ce_gated:
      alpha: 0.7                 # Weight for original query relevance (0-1)
      aggregation: "max"         # How to aggregate sub-query scores: "max" or "mean"
    
    # Cross-encoder configuration (required for ce_gated, optional for rrf/interleave)
    cross_encoder:
      enabled: true              # Set to true to enable cross-encoder reranking
      providers: ["dspy"]        # Available: "cohere", "voyage", "dspy" (LLM-based)
      provider: "dspy"           # Auto-select, or force: "cohere", "voyage", "dspy", "hybrid"
      top_k: 50                  # Final results after CE reranking (for post-fusion reranking)
      
      # DSPy LLM reranker settings (when providers includes "dspy")
      # Uses the configured dspy.lm to score relevance
      dspy:
        signature: "numeric"     # "numeric" (0.0-1.0 scores) or "binary" (yes/no)
        verbose: true            # Use verbose signature with detailed instructions

  # ───────────────────────────────────────────────────────────────────────────
  # HyDE_QueryExpander
  # ───────────────────────────────────────────────────────────────────────────
  # Generates a hypothetical passage that answers the question,
  # then uses that passage as the search query (Hypothetical Document Embeddings).

  HyDE_QueryExpander:
    retrieved_k: 20
    verbose: false
    search_only: true

  # ───────────────────────────────────────────────────────────────────────────
  # PRF_QueryExpander
  # ───────────────────────────────────────────────────────────────────────────
  # Pseudo-Relevance Feedback: performs an initial search, then uses those
  # results as hints to expand the original query for a second search.

  PRF_QueryExpander:
    retrieved_k: 20
    verbose: false
    search_only: true

  # ───────────────────────────────────────────────────────────────────────────
  # SearchQueryWriter
  # ───────────────────────────────────────────────────────────────────────────
  # Rewrites the user's question into an optimized search query
  # before executing the search.

  SearchQueryWriter:
    retrieved_k: 20
    verbose: false
    search_only: true
